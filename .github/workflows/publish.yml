name: Publish to NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 1.0.1). Leave empty to use Directory.Build.props version'
        required: false
        type: string

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Priority: manual override > release tag (v1.2.3 -> 1.2.3) > Directory.Build.props
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$VERSION" ]; then
            echo "msbuild_args=-p:Version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "msbuild_args=" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: ${VERSION:-from Directory.Build.props}"

      - name: Restore dependencies
        run: dotnet restore BetterRedsys.slnx

      - name: Build solution
        run: dotnet build BetterRedsys.slnx -c Release --no-restore ${{ steps.version.outputs.msbuild_args }}

      - name: Run tests
        run: dotnet test BetterRedsys.slnx -c Release --no-build --verbosity normal

      - name: Pack NuGet packages
        run: dotnet pack BetterRedsys.slnx -c Release --no-build -o ./nupkgs ${{ steps.version.outputs.msbuild_args }}

      - name: NuGet Login (Trusted Publishing via OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./nupkgs/*.nupkg
          generate_release_notes: true
