name: CI / CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ "published" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore BetterRedsys.slnx

    - name: Build Solution (Release)
      run: dotnet build BetterRedsys.slnx -c Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Run Tests
      run: dotnet test BetterRedsys.slnx -c Release --no-build --verbosity normal

    - name: Pack NuGet
      run: dotnet pack BetterRedsys.slnx -c Release --no-build -o ./artifacts

    - name: Upload NuGet Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 7
