<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterRedsys Simulator • Active / Activo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #090d16;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 9999px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .code {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #06b6d4;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">● SIMULATOR ONLINE</div>
        <h1>BetterRedsys Simulator</h1>
        <p>The local Redsys &amp; Bizum simulator is active and ready to intercept payment requests from your application.</p>
        <div class="code">
            // Payments generated with RedsysPaymentBuilder<br />
            // will be automatically intercepted at this route:<br />
            Endpoint: {{ENDPOINT_PATH}}
        </div>
    </div>
</body>
</html>
